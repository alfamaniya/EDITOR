<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Editor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="panel code-panel" aria-label="Code Editor">
    <header class="panel-header editor-header" aria-label="Editor Header">
      <div class="editor-header-left">
        <iframe class="editor-action-frame" src="../undo/index.html" title="Undo"></iframe>
        <iframe class="editor-action-frame" src="../clear/index.html" title="Clear"></iframe>
      </div>
      <iframe class="editor-action-frame redo-button" src="../redo/index.html" title="Redo"></iframe>
    </header>
    <div class="editor-tabs" role="tablist" aria-label="Code languages">
      <button class="editor-tab is-active" id="html-tab" type="button" role="tab" aria-selected="true" aria-controls="html-editor" data-language="html">HTML</button>
      <button class="editor-tab" id="css-tab" type="button" role="tab" aria-selected="false" aria-controls="css-editor" data-language="css">CSS</button>
      <button class="editor-tab" id="js-tab" type="button" role="tab" aria-selected="false" aria-controls="js-editor" data-language="js">JS</button>
    </div>
    <div class="editor-area" id="editor-area">
      <div class="code-editor is-visible" id="html-editor" data-language="html" aria-label="HTML code"></div>
      <div class="code-editor" id="css-editor" data-language="css" aria-label="CSS code" hidden></div>
      <div class="code-editor" id="js-editor" data-language="js" aria-label="JavaScript code" hidden></div>
    </div>
  </section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
