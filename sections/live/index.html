<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Preview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="panel preview-panel" aria-labelledby="preview-title">
    <header class="panel-header live-header" aria-label="Live Header">
      <h1 id="preview-title">Live Preview</h1>
    </header>
    <div class="preview-area" aria-label="Live code display area">
      <iframe class="preview-frame" title="Rendered code preview" sandbox="allow-scripts"></iframe>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
