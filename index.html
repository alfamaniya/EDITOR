<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header" aria-label="Main Header">
    <div class="main-header-actions">
      <button class="main-header-button" type="button" aria-label="Clear All">Clear All</button>
      <button class="main-header-button" type="button" aria-label="Download">Download</button>
      <button class="main-header-button" type="button" aria-label="Import">Import</button>
      <iframe class="header-reset-frame" src="sections/reset/index.html" title="Reset project"></iframe>
      <a class="main-header-button libraries-button" href="sections/libraries/index.html" aria-label="Open Libraries page">Libraries</a>
    </div>
  </header>

  <main class="workspace" aria-label="Code workspace">
    <iframe class="component-frame" src="sections/editor/index.html" title="Code Editor"></iframe>
    <div class="splitter" role="separator" aria-label="Resize panels"
         aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75"
         aria-valuenow="50" tabindex="0"></div>
    <iframe class="component-frame" src="sections/live/index.html" title="Live Preview"></iframe>
  </main>

  <iframe class="download-frame" src="sections/download/index.html" title="Download project" aria-label="Download dialog"></iframe>
  <footer class="site-footer" aria-label="Footer"></footer>

  <script src="script.js"></script>
</body>
</html>
