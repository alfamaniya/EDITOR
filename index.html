<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header" aria-label="Header"></header>

  <main class="workspace" aria-label="Code workspace">
    <section class="panel code-panel" aria-labelledby="code-title">
      <header class="panel-header">
        <h1 id="code-title">Code Editor</h1>
      </header>
      <div class="editor-area" aria-label="Code writing area"></div>
    </section>

    <div class="splitter" role="separator" aria-label="Resize panels"
         aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75"
         aria-valuenow="50" tabindex="0"></div>

    <section class="panel preview-panel" aria-labelledby="preview-title">
      <header class="panel-header">
        <h2 id="preview-title">Live Preview</h2>
      </header>
      <div class="preview-area" aria-label="Live code display area"></div>
    </section>
  </main>

  <footer class="site-footer" aria-label="Footer"></footer>

  <script src="script.js"></script>
</body>
</html>
