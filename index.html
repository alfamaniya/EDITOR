<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header" aria-label="Main Header">
    <div class="main-header-actions">
      <button class="main-header-button" type="button" aria-label="Clear All">Clear All</button>
      <button class="main-header-button" type="button" aria-label="Download">Download</button>
      <button class="main-header-button" type="button" aria-label="Import">Import</button>
    </div>
  </header>

  <main class="workspace" aria-label="Code workspace">
    <section class="panel code-panel" aria-labelledby="code-title">
      <header class="panel-header editor-header" aria-label="Editor Header">
        <div class="editor-header-left">
          <button class="history-button" type="button" aria-label="Undo">Undo</button>
          <button class="history-button" type="button" aria-label="Clear">Clear</button>
        </div>
        <h1 id="code-title">Code Editor</h1>
        <button class="history-button redo-button" type="button" aria-label="Redo">Redo</button>
      </header>
      <div class="editor-tabs" role="tablist" aria-label="Code languages">
        <button class="editor-tab is-active" id="html-tab" type="button" role="tab"
                aria-selected="true" aria-controls="editor-area" data-language="html">HTML</button>
        <button class="editor-tab" id="css-tab" type="button" role="tab"
                aria-selected="false" aria-controls="editor-area" data-language="css">CSS</button>
        <button class="editor-tab" id="js-tab" type="button" role="tab"
                aria-selected="false" aria-controls="editor-area" data-language="js">JS</button>
      </div>
      <div class="editor-area" id="editor-area" role="tabpanel" aria-labelledby="html-tab"
           aria-label="Code writing area"></div>
    </section>

    <div class="splitter" role="separator" aria-label="Resize panels"
         aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75"
         aria-valuenow="50" tabindex="0"></div>

    <section class="panel preview-panel" aria-labelledby="preview-title">
      <header class="panel-header live-header" aria-label="Live Header">
        <h2 id="preview-title">Live Preview</h2>
      </header>
      <div class="preview-area" aria-label="Live code display area"></div>
    </section>
  </main>

  <footer class="site-footer" aria-label="Footer"></footer>

  <script src="script.js"></script>
</body>
</html>
