<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Editor workspace">
  <title>Editor — Workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Editor home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="brand-name">Editor</span>
      </a>
      <div class="topbar-center">
        <span class="workspace-dot" aria-hidden="true"></span>
        <span>Workspace</span>
      </div>
      <div class="topbar-right">
        <span class="status-indicator" aria-hidden="true"></span>
        <span class="status-text">Ready</span>
        <span class="avatar" aria-hidden="true">E</span>
      </div>
    </header>

    <main class="workspace" aria-label="Workspace panels">
      <section class="panel panel-one" aria-labelledby="panel-one-title">
        <div class="panel-header">
          <div class="panel-heading">
            <span class="panel-index">01</span>
            <h1 id="panel-one-title">Panel One</h1>
          </div>
          <span class="panel-menu" aria-hidden="true">•••</span>
        </div>
        <div class="panel-content">
          <div class="placeholder-art" aria-hidden="true">
            <div class="art-window">
              <div class="art-window-bar"><i></i><i></i><i></i></div>
              <div class="art-line line-a"></div>
              <div class="art-line line-b"></div>
              <div class="art-line line-c"></div>
              <div class="art-block"></div>
            </div>
          </div>
          <p class="placeholder-title">Your workspace starts here</p>
          <p class="placeholder-copy">This area is reserved for a future feature.</p>
        </div>
        <div class="panel-footer"><span>AREA 01</span><span>EDITOR</span></div>
      </section>

      <div class="splitter" role="separator" aria-label="Resize panels" aria-orientation="vertical"
           aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0">
        <span class="splitter-grip" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>

      <section class="panel panel-two" aria-labelledby="panel-two-title">
        <div class="panel-header">
          <div class="panel-heading">
            <span class="panel-index">02</span>
            <h2 id="panel-two-title">Panel Two</h2>
          </div>
          <span class="panel-menu" aria-hidden="true">•••</span>
        </div>
        <div class="panel-content">
          <div class="empty-orbit" aria-hidden="true">
            <span class="orbit orbit-one"></span>
            <span class="orbit orbit-two"></span>
            <span class="orbit-core"><span></span></span>
          </div>
          <p class="placeholder-title">A space for what’s next</p>
          <p class="placeholder-copy">The purpose of this area can be defined later.</p>
        </div>
        <div class="panel-footer"><span>AREA 02</span><span>EDITOR</span></div>
      </section>
    </main>
    <footer class="app-footer">
      <span>EDITOR WORKSPACE</span>
      <span class="footer-right"><span class="footer-key">⌘</span> <span>Workspace</span></span>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
