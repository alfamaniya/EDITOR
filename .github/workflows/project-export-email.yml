name: Build and Email Project

on:
  workflow_dispatch:
    inputs:
      confirm_send:
        description: Confirm building the complete project and sending it by email
        required: true
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: read

jobs:
  export-and-email:
    if: inputs.confirm_send == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build one-file project
        run: node project-export/build.js

      - name: Validate exported file
        run: node project-export/validate.js

      - name: Install email dependency
        run: npm install --no-save --no-package-lock nodemailer

      - name: Send project by Gmail
        run: node project-export/send-email.js
        env:
          GMAIL_ADDRESS: \${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: \${{ secrets.GMAIL_APP_PASSWORD }}
          COMPANY_EMAIL: \${{ secrets.COMPANY_EMAIL }}
