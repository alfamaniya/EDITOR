name: Build Single Project File

on:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/project.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-single-project-file
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build single project file
        run: node project-export/build.js

      - name: Validate single project file
        run: node project-export/validate.js

      - name: Commit updated project.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/project.txt
          if git diff --cached --quiet; then
            echo "project.txt is already up to date."
          else
            git commit -m "Update generated project.txt"
            git push
          fi
